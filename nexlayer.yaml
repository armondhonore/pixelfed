application:
  name: pixelfed
  pods:
  - name: app
    image: zknt/pixelfed:latest
    path: /
    servicePorts:
    - 80
    vars:
      DB_CONNECTION: mysql
      DB_HOST: mysql.pod
      DB_PORT: "3306"
      DB_DATABASE: pixelfed
      DB_USERNAME: pixelfed
      DB_PASSWORD: pixelfed
      REDIS_CLIENT: predis
      REDIS_HOST: redis.pod
      APP_URL: "https://relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      APP_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      ADMIN_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      SESSION_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      APP_KEY: "base64:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
    volumes:
    - name: pixelfed-storage
      mountPath: /var/www/storage
      size: 10Gi
  - name: mysql
    image: mysql:8
    servicePorts:
    - 3306
    vars:
      MYSQL_DATABASE: pixelfed
      MYSQL_USER: pixelfed
      MYSQL_PASSWORD: pixelfed
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
    - name: pixelfed-db
      mountPath: /var/lib/mysql
      size: 5Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: pixelfed-redis
      mountPath: /data
      size: 2Gi
