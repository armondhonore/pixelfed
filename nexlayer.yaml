application:
  name: pixelfed
  pods:
  - name: app
    image: mirror.gcr.io/zknt/pixelfed:latest
    path: /
    servicePorts:
    - 80
    vars:
      DB_CONNECTION: mysql
      DB_HOST: mysql.pod
      DB_PORT: "3306"
      DB_DATABASE: pixelfed
      DB_USERNAME: pixelfed
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis.pod
      APP_URL: "https://relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      APP_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      ADMIN_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      SESSION_DOMAIN: "relaxed-weasel-pixelfed.cloud.nexlayer.ai"
      APP_KEY: "base64:D41iXqDiRU5tV68xVXQgJw+IqjjJM/14sR84zYDaEnk="
    volumes:
    - name: pixelfed-storage
      mountPath: /var/www/storage
      size: 10Gi
  - name: mysql
    image: mirror.gcr.io/library/mysql:8
    servicePorts:
    - 3306
    vars:
      MYSQL_DATABASE: pixelfed
      MYSQL_USER: pixelfed
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  - name: redis
    image: mirror.gcr.io/library/redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: pixelfed-redis
      mountPath: /data
      size: 2Gi
